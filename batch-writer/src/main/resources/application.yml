spring:
  application:
    name: batch-writer
  rabbitmq:
    # Im Docker-Netz heisst der Broker "rabbitmq". Beim Start ausserhalb
    # von Docker greift der Vorgabewert "localhost".
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  datasource:
    # Im Docker-Netz heisst die Datenbank "postgres". Der Port ist fest,
    # genau wie 5672 beim Broker.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:chat}
    username: ${POSTGRES_USER:chat}
    # Bewusst OHNE Vorgabewert: der Dienst soll sich nie still mit einem
    # eingebauten Passwort verbinden.
    password: ${POSTGRES_PASSWORD}
    hikari:
      # Ein Schreibversuch wartet höchstens 5 s auf eine Verbindung. Danach
      # gilt er als gescheitert, und der Listener wartet und versucht es
      # erneut (Spec 3.2.1).
      connection-timeout: 5000

logging:
  level:
    # Im Unterricht wollen wir jeden Schritt sehen.
    ch.benedict.m321: DEBUG
