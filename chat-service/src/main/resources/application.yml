spring:
  application:
    name: chat-service
  rabbitmq:
    # Im Docker-Netz heisst der Broker "rabbitmq". Beim Start ausserhalb
    # von Docker greift der Vorgabewert "localhost".
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Gilt für den einzigen Listener, den DeliveryListener (Spec 4.1).
    listener:
      simple:
        # Genau ein Thread liest die Zustell-Queue. Mit mehreren könnte
        # Nachricht 6 beim Senden Nachricht 5 überholen (Spec 3.2.1).
        concurrency: 1
        max-concurrency: 1
        # Höchstens 50 unbestätigte Nachrichten beim Listener. Zusammen mit
        # x-max-length 900 zeigt rabbitmqctl höchstens 950, unter 1000 (S6).
        prefetch: 50
        # Eine Nachricht, deren Verarbeitung scheitert, nicht zurücklegen.
        # Sonst scheitert sie beim nächsten Versuch wieder, endlos (Spec 3.2.6).
        default-requeue-rejected: false

server:
  port: 8080

logging:
  level:
    # Im Unterricht wollen wir jeden Schritt sehen.
    ch.benedict.m321: DEBUG

instance:
  # Teil des Namens der Zustell-Queue (Spec 4). Docker setzt HOSTNAME in jedem
  # Container auf die kurze Container-ID. Ausserhalb von Docker, etwa unter
  # Windows, fehlt die Variable, dann steht hier "local".
  hostname: ${HOSTNAME:local}
